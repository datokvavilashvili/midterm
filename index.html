<html lang="en">
  <head>

    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styless.css" />
        <title>Document</title>
      </head>
      <body>
        <div class="app-container">
          <aside class="sidebar">
            <div class="brand">
              <h2>design.today</h2>
              <img
                src="images/sidebar/hamburger-icon.svg"
                class="sidebar-icon"
                alt="hamburger-icon"
              />
            </div>

            <nav class="nav-menu">
              <a href="#" class="nav-item active">
                <img
                  src="./images/sidebar/home-icon.svg"
                  class="sidebar-icon"
                  alt="Home-icon"
                />
                Home
              </a>

              <a href="#" class="nav-item">
                <img
                  src="./images/sidebar/explore.svg"
                  class="sidebar-icon"
                  alt="Explore"
                />
                Explore
              </a>

              <a href="#" class="nav-item">
                <img
                  src="./images/sidebar/folders.svg"
                  class="sidebar-icon"
                  alt="Folders"
                />
                Folders
              </a>

              <a href="#" class="nav-item">
                <img
                  src="./images/sidebar/favourites.svg"
                  class="sidebar-icon"
                  alt="Favourites"
                />
                Favourites
              </a>

              <a href="#" class="nav-item">
                <img
                  src="./images/sidebar/activities.svg"
                  class="sidebar-icon"
                  alt="Activities"
                />
                Activities
              </a>
            </nav>

            <div class="following-section">
              <p class="section-title">FOLLOWING</p>
              <ul class="following-list">
                <li>
                  <img src="./images/sidebar/sajon.png" alt="Sajon" /> Sajon
                </li>
                <li>
                  <img
                    src="./images/sidebar/Tran Mau Tri Tam.png"
                    alt="Tran Mau Tri Tam"
                  />
                  Tran Mau Tri Tam
                </li>
                <li>
                  <img
                    src="images/sidebar/Ghani Pradita.png"
                    alt="Ghani Pradita"
                  />
                  Ghani Pradita
                </li>
                <li>
                  <img
                    src="./images/sidebar/David Kovalev.png"
                    alt="David Kovalev"
                  />
                  David Kovalev
                </li>
                <li>
                  <img src="images/sidebar/Ryan Putnam.png" alt="Ryan Putnam" />
                  Ryan Putnam
                </li>
              </ul>
              <a href="#" class="load-more-link">Load more (15)</a>
            </div>
          </aside>
          <main class="main-content">
            <header class="top-header">
              <div class="search-bar">
                <input type="text" placeholder="Search inspiration" />
                <img
                  src="./images/main-header/search.svg"
                  class="search-icon"
                  alt="Search"
                />
              </div>

              <div class="header-right">
                <span class="pro-tag">GO PRO!</span>

                <div class="header-envelope">
                  <img
                    src="./images/main-header/envelope.svg"
                    class="header-icon"
                    alt="Envelope"
                  />
                  <span class="badge"></span>
                </div>

                <div class="header-bell">
                  <img
                    src="./images/main-header/bell.svg"
                    class="header-icon"
                    alt="Bell"
                  />
                  <span class="badge"></span>
                </div>

                <img
                  src="./images/main-header/user-avatar.png"
                  class="user-avatar"
                  alt="User Avatar"
                />

                <button class="btn-primary">UPLOAD</button>
              </div>
            </header>
          </main>
        </div>
      </body>
    </html>
  </body>
</html>
